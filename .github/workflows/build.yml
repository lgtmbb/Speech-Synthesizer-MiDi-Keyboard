name: Build portable Windows app

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SpeechMidiKeyboard.sln

      - name: Publish portable, self-contained, single-file build
        run: >
          dotnet publish src/SpeechMidiKeyboard/SpeechMidiKeyboard.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload build as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeechMidiKeyboard-windows-portable
          path: publish/
