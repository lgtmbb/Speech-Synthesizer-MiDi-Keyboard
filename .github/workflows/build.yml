name: Build portable Windows app

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# Needed so the workflow's own GITHUB_TOKEN is allowed to create/update a Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SpeechMidiKeyboard.sln

      - name: Publish portable, self-contained build (folder, not single-file)
        # PublishSingleFile intentionally NOT used: its self-extracting launcher stub
        # is what triggered a heuristic-only antivirus false positive (Zillya) on
        # VirusTotal. A plain folder publish has no extraction step and avoids that
        # behavioral pattern entirely; it's still fully portable (just copy the folder).
        run: >
          dotnet publish src/SpeechMidiKeyboard/SpeechMidiKeyboard.csproj
          -c Release -r win-x64 --self-contained true
          -o publish

      - name: Zip the published app
        run: Compress-Archive -Path publish\* -DestinationPath SpeechMidiKeyboard-windows-portable.zip

      - name: Upload build as a workflow artifact (requires GitHub login)
        uses: actions/upload-artifact@v4
        with:
          name: SpeechMidiKeyboard-windows-portable
          path: publish/

      - name: Publish/update a public "latest" GitHub Release with the zip attached
        # This gives a plain, no-login-required direct download link, unlike
        # workflow artifacts (which require a GitHub session to fetch).
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Legfrissebb automatikus build"
          body: "Automatikusan összeállítva a(z) ${{ github.sha }} commitból."
          artifacts: SpeechMidiKeyboard-windows-portable.zip
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
